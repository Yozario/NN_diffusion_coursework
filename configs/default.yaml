# Общие настройки проекта. Все скрипты читают этот файл (флаг --config меняет путь).
# Пути указываются относительно корня репозитория.

seed: 42

paths:
  data_dir: data                  # сюда при первом запуске скачивается CIFAR-10 (~170 МБ)
  results_dir: results            # таблицы с числами (CSV, JSON)
  figures_dir: results/figures    # все графики для отчёта
  logs_dir: results/logs          # логи запусков (не хранятся в git)
  checkpoints_dir: checkpoints    # веса моделей (не хранятся в git)

data:
  val_size: 5000          # стратифицированно: по 500 картинок каждого класса, остальные 45 000 — train
  batch_size: 64          # под 4 ГБ видеопамяти; при запасе памяти можно 128
  num_workers: 2          # на Windows больше 2–4 обычно не ускоряет
  hflip: true             # случайное горизонтальное отражение только для train

diffusion:
  num_steps: 1000         # T — число шагов прямого процесса
  schedule: linear        # linear | cosine
  beta_start: 1.0e-4      # для линейного расписания
  beta_end: 0.02
  cosine_s: 0.008         # смещение s для косинусного расписания (Nichol & Dhariwal, 2021)

# Эксперимент 1: проверка прямого процесса
experiment1:
  n_images: 8                                       # картинок в сетке деградации (по одной на класс)
  grid_timesteps: [0, 25, 50, 100, 200, 300, 500, 700, 1000]
  ks_images: 64                                     # картинок x_0 в одном повторе проверки
  ks_timesteps: [10, 100, 300, 600, 1000]           # шаги, на которых сравниваются распределения
  ks_repeats: 20                                    # число повторов с разными seed
  variance_every: 10                                # шаг записи дисперсии вдоль траектории

# Разделы model / training (роль 2) и classifier / analysis (роль 3) добавляются сюда же.
