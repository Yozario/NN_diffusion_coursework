# Общие настройки проекта. Все скрипты читают этот файл (флаг --config меняет путь).
# Пути указываются относительно корня репозитория.

seed: 42

paths:
  data_dir: data                  # сюда при первом запуске скачивается CIFAR-10 (~170 МБ)
  results_dir: results            # таблицы с числами (CSV, JSON)
  figures_dir: results/figures    # все графики для отчёта
  logs_dir: results/logs          # логи запусков (не хранятся в git)
  checkpoints_dir: checkpoints    # веса моделей (не хранятся в git)

data:
  val_size: 5000          # стратифицированно: по 500 картинок каждого класса, остальные 45 000 — train
  batch_size: 64          # под 4 ГБ видеопамяти; при запасе памяти можно 128
  num_workers: 2          # на Windows больше 2–4 обычно не ускоряет
  hflip: true             # случайное горизонтальное отражение только для train

diffusion:
  num_steps: 1000         # T — число шагов прямого процесса
  schedule: linear        # linear | cosine
  beta_start: 1.0e-4      # для линейного расписания
  beta_end: 0.02
  cosine_s: 0.008         # смещение s для косинусного расписания (Nichol & Dhariwal, 2021)

# Эксперимент 1: проверка прямого процесса
experiment1:
  n_images: 8                                       # картинок в сетке деградации (по одной на класс)
  grid_timesteps: [0, 25, 50, 100, 200, 300, 500, 700, 1000]
  ks_images: 64                                     # картинок x_0 в одном повторе проверки
  ks_timesteps: [10, 100, 300, 600, 1000]           # шаги, на которых сравниваются распределения
  ks_repeats: 20                                    # число повторов с разными seed
  variance_every: 10                                # шаг записи дисперсии вдоль траектории

# U-Net, предсказывающий шум. Размер подобран под видеокарту с 4 ГБ памяти: ~6.5 млн параметров.
model:
  image_size: 32
  in_channels: 3
  base_channels: 64          # C — каналы на первом уровне
  channel_mults: [1, 2, 2]   # уровни 32×32, 16×16, 8×8 с каналами C, 2C, 2C
  num_res_blocks: 2          # остаточных блоков на уровень спуска (на подъёме — на один больше)
  attn_resolutions: [16]     # самовнимание только на 16×16
  num_heads: 4
  dropout: 0.1

# Обучение. Время — для RTX 3050 Laptop 4 ГБ, батч 64 (data.batch_size): ~0.2 с на шаг.
training:
  total_steps: 100000      # ~6 часов, ~140 эпох
  lr: 2.0e-4               # Adam, как в DDPM
  warmup_steps: 1000       # линейный разогрев скорости обучения
  grad_clip: 1.0           # ограничение нормы градиента
  ema_decay: 0.9999
  amp: true                # смешанная точность: bfloat16, если поддерживается, иначе float16
  num_workers: 0           # батч готовится в основном процессе (~5 мс), пока видеокарта считает шаг
  log_every: 100           # строка в results/train_log.csv
  val_every: 2000          # потеря на валидации — results/train_val.csv и график
  val_images: 2000         # фиксированные картинки из val с фиксированными t и шумом
  sample_every: 10000      # сетка сгенерированных картинок
  sample_count: 64
  checkpoint_every: 2000   # checkpoints/last.pt — для продолжения после остановки
  ema_save_every: 10000    # отдельные EMA-веса checkpoints/ema_step*.pt

# Генерация (обратный процесс)
sampling:
  variance: beta           # дисперсия шума на шаге: beta — β_t (как в DDPM для CIFAR-10), posterior — β̃_t
  clip_x0: true            # обрезать оценку x̂_0 до [−1, 1]

# Эксперимент 2: восстановление картинок после зашумления до шага t
experiment2:
  checkpoint: checkpoints/ema_final.pt
  n_images: 512            # тестовые картинки для PSNR и SSIM
  batch_size: 256
  timesteps: [50, 100, 200, 300, 500, 700, 1000]
  error_images: 2000       # тестовые картинки для ошибки предсказания шума
  error_timesteps: [1, 5, 10, 25, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]
  grid_images: 6           # строк в сетке примеров (разные классы)
  grid_timesteps: [100, 300, 500, 1000]
  stochastic_images: 4     # картинок, для которых показаны несколько восстановлений одной и той же x_t
  stochastic_samples: 5
  stochastic_t: 500
